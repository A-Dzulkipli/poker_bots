# One file per bot. Run from bots/phase_6_trails: python fill_prompt.py estelle_claude/prompt.toml
output = "./PROMPT.md"                 # relative to this file
template = "../botgen_v6_prompt.md"    # relative to this file

[slots]
BOT_NAME = "estelle_claude"             # snake_case; must match the bot's directory name
LINEAGE = "phase_6_trails/estelle_claude"
BENCHMARK_SET = "The eighteen-bot field (`field`), which `bench.py` loads from `../field/` and you must not read, scored by the weighted score, which is your primary score; and every earlier version of your own bot (`vK:Bot`)."
CONSTRAINTS = "None beyond the restrictions below."
ROOT_DIR = "/Users/alik/Documents/Projects/poker_bots/poker_bots/bots/phase_6_trails"

[[slots.METADATA_BLOCKS]]
role = "requester"
who = "a"

[[slots.METADATA_BLOCKS]]
role = "generator"
interface = "Claude desktop"

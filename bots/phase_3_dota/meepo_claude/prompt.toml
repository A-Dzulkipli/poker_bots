# One file per bot. Run from bots/phase_3_dota: python fill_prompt.py meepo_claude/prompt.toml
output = "./PROMPT.md"                 # relative to this file
template = "../botgen_v3_prompt.md"    # relative to this file

[slots]
BOT_NAME = "meepo_claude"             # snake_case; must match the bot's directory name
LINEAGE = "phase_3_dota/meepo_claude"
BENCHMARK_SET = "The core group in `opponents/core/` (`core`: the three phase-2 finals and the aggressor probe), which is your primary score; the legacy group in `opponents/legacy/` (`legacy`: the four phase-1 finals); every earlier version of your own bot (`vK:Bot`); and RandomBot (`random`) as a sanity check only."
CONSTRAINTS = "None beyond the restrictions below."
# ROOT_DIR defaults to this file's parent directory (bots/phase_3_dota); set it to override.

[[slots.METADATA_BLOCKS]]
role = "requester"
who = "a"

[[slots.METADATA_BLOCKS]]
role = "generator"
interface = "Claude desktop (Code)"
